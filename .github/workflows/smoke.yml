name: smoke

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync --all-groups
      - name: Live providers
        run: uv run pytest -m live
